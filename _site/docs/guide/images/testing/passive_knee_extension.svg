<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Passive Knee Extension Test</title>
  <desc>Lateral view of a supine leg in near-full extension. Black anatomical silhouette with a red goniometer aligned to the greater trochanter, lateral femoral condyle and lateral malleolus, showing a 5 degree extension deficit.</desc>

  <defs>
    <!-- Soft fade where the leg is cropped at the hip -->
    <linearGradient id="hipFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="legMask">
      <rect width="680" height="400" fill="url(#hipFade)"/>
    </mask>
  </defs>

  <rect width="680" height="400" fill="#FFFFFF"/>

  <!-- ===== LEG SILHOUETTE (black) ===== -->
  <g mask="url(#legMask)" fill="#111111">
    <!-- Thigh -->
    <path d="
      M 0 138
      C 120 132, 230 145, 300 160
      C 320 164, 332 162, 345 158
      C 362 153, 382 158, 392 172
      L 392 222
      C 378 228, 360 232, 340 234
      C 280 240, 180 258, 60 272
      C 35 276, 15 282, 0 288
      Z"/>

    <!-- Lower leg + foot, rotated 5° about the knee (extension deficit) -->
    <g transform="rotate(5 360 200)">
      <path d="
        M 340 172
        C 355 162, 378 162, 392 172
        C 400 178, 405 182, 418 183
        C 480 184, 540 186, 578 188
        C 590 186, 598 176, 606 160
        C 618 138, 630 118, 638 108
        C 644 100, 656 100, 658 110
        C 660 120, 656 134, 652 146
        C 646 170, 640 196, 634 214
        C 628 230, 612 236, 598 232
        C 586 228, 575 222, 560 218
        C 520 214, 495 244, 455 254
        C 430 258, 410 254, 395 244
        C 380 236, 360 236, 340 236
        Z"/>
      <!-- Subtle contours: tibial crest / gastrocnemius / Achilles -->
      <g fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round">
        <path d="M 400 232 C 440 236, 480 228, 520 220"/>
        <path d="M 540 212 C 560 212, 580 216, 600 222"/>
      </g>
    </g>

    <!-- Subtle contours: quadriceps / patella -->
    <g fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round">
      <path d="M 140 220 C 210 216, 280 220, 330 226"/>
      <path d="M 344 170 C 356 163, 374 164, 384 174"/>
    </g>
  </g>

  <!-- ===== GONIOMETER (red) ===== -->
  <!-- Full-extension reference (0°) -->
  <line x1="360" y1="200" x2="575" y2="200" stroke="#D71920" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Stationary arm: towards greater trochanter -->
  <line x1="360" y1="200" x2="150" y2="200" stroke="#D71920" stroke-width="6" stroke-linecap="round"/>
  <!-- Moving arm: towards lateral malleolus (5° below horizontal) -->
  <line x1="360" y1="200" x2="564" y2="218" stroke="#D71920" stroke-width="6" stroke-linecap="round"/>

  <!-- Deficit arc + label -->
  <path d="M 530 200 A 170 170 0 0 1 529.4 214.8" fill="none" stroke="#D71920" stroke-width="2.5"/>
  <line x1="528" y1="218" x2="515" y2="290" stroke="#D71920" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="515" y="316" font-family="'Open Sans', Arial, sans-serif" font-size="24" font-weight="700" fill="#D71920" text-anchor="middle">5°</text>

  <!-- Pivot -->
  <circle cx="360" cy="200" r="9" fill="#FFFFFF" stroke="#D71920" stroke-width="3"/>
  <circle cx="360" cy="200" r="2.5" fill="#D71920"/>

  <!-- ===== BONY LANDMARKS ===== -->
  <g font-family="'Open Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#D71920" text-anchor="middle">
    <!-- Greater trochanter -->
    <circle cx="130" cy="200" r="5.5" fill="#FFFFFF" stroke="#D71920" stroke-width="2"/>
    <line x1="130" y1="194" x2="130" y2="108" stroke="#D71920" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="130" y="82">Greater</text>
    <text x="130" y="99">trochanter</text>

    <!-- Lateral femoral condyle -->
    <line x1="360" y1="190" x2="360" y2="118" stroke="#D71920" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="360" y="92">Lat. femoral</text>
    <text x="360" y="109">condyle</text>

    <!-- Lateral malleolus -->
    <circle cx="584" cy="219.6" r="5.5" fill="#FFFFFF" stroke="#D71920" stroke-width="2"/>
    <line x1="586" y1="226" x2="606" y2="316" stroke="#D71920" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="610" y="333">Lat.</text>
    <text x="610" y="350">malleolus</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
